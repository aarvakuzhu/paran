<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paran – Inventory</title>
  <meta name="description" content="Know what you have, where it is, and what it's for. Data stays in your own Google Drive.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Paran">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <!-- fetch every module in parallel instead of one after another -->
  <link rel="modulepreload" href="js/config.js"><link rel="modulepreload" href="js/google.js"><link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/search.js"><link rel="modulepreload" href="js/image.js"><link rel="modulepreload" href="js/ai.js">
  <link rel="modulepreload" href="js/ui.js"><link rel="modulepreload" href="js/idb.js"><link rel="modulepreload" href="js/scan.js"><link rel="modulepreload" href="js/qrscan.js"><link rel="modulepreload" href="js/inventories.js"><link rel="modulepreload" href="js/events.js"><link rel="modulepreload" href="js/xinv.js"><link rel="modulepreload" href="js/receipt.js"><link rel="modulepreload" href="js/stats.js">
  <style>
    /* shown the instant the page opens, before any script or stylesheet arrives */
    .splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: #f6f3ee;
      font: 600 1.25rem/1 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d1b18; }
    .splash i { width: 64px; height: 64px; border-radius: 18px; background: #2f5d50; display: grid; place-items: center; }
    .splash::after { content: "Loading…"; font: 400 0.9rem/1 ui-sans-serif, -apple-system, sans-serif; opacity: 0; animation: splashIn 0.3s 1.5s forwards; }
    .splash:has(.splash-msg)::after { content: none; }
    @keyframes splashIn { to { opacity: 0.6; } }
    .splash-msg { max-width: 280px; text-align: center; font-weight: 400; font-size: 15px; line-height: 1.45; }
    .splash-btn { min-width: 220px; min-height: 46px; border-radius: 999px; border: 1px solid #d9d3c8; background: transparent; font: 600 15px/1 ui-sans-serif, -apple-system, sans-serif; color: inherit; cursor: pointer; }
    .splash-btn.primary { background: #2f5d50; border-color: #2f5d50; color: #fff; }
    .splash-note { max-width: 260px; text-align: center; font-weight: 400; font-size: 12px; opacity: 0.7; }
    @media (prefers-color-scheme: dark) { .splash { background: #161513; color: #f1ede6; } }
  </style>
</head>
<body>
  <div id="app"><div class="splash" aria-label="Loading Paran"><i><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7 12 3l9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg></i>Paran</div></div>
  <div id="toasts" aria-live="polite"></div>
  <script>
    // Startup check (below): never leave the user on the logo, and say exactly what's wrong.
    // "Get the latest version" only clears the app's own files; the inventory (stored separately on this phone and in Google) is untouched.
    // Paran and the frozen Stash pilot (/stash/) share this site, so they share the phone's storage.
    // Paran keeps its own "paran." keys; on first run it copies the pilot's "stash." keys once (sign-in, cache,
    // settings), so testers continue where they were. The pilot's keys are never changed.
    (function () {
      try {
        if (!localStorage.getItem('paran.migrated')) {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('stash.') === 0) { var nk = 'paran.' + k.slice(6); if (localStorage.getItem(nk) === null) localStorage.setItem(nk, localStorage.getItem(k)); }
          }
          localStorage.setItem('paran.migrated', String(Date.now()));
        }
      } catch (e) {}
    })();
    (function () {
      // Startup check. If the app hasn't started after a few seconds, find out why before saying anything:
      // a new version downloading, offline, a file that didn't load, an error, an older version on this phone,
      // or just a slow connection. Then show that, with the one button that fixes it.
      var shown = false; var problem = null; // { file } or { msg }
      var LOGO = '<i><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7 12 3l9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg></i>';
      var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
      var num = function (v) { var m = /(\d+)\s*$/.exec(v || ''); return m ? m[1] : (v || '?'); };
      function show(msg, buttons, note) {
        if (window.__paranStarted) return;
        document.getElementById('app').innerHTML = '<div class="splash">' + LOGO + '<div class="splash-msg">' + msg + '</div>'
          + buttons.map(function (b, i) { return '<button class="splash-btn' + (i ? '' : ' primary') + '" onclick="' + b[1] + '">' + b[0] + '</button>'; }).join('')
          + (note ? '<small class="splash-note">' + note + '</small>' : '') + '</div>';
      }
      var UPDATE = ['Get the latest version', 'window.__paranRepair()'];
      var AGAIN = ['Try again', 'location.reload()'];
      var SAFE = 'Your inventory stays exactly as it is.';
      function phoneVersion() { // asked from the worker running this page
        return new Promise(function (res) {
          var c = navigator.serviceWorker && navigator.serviceWorker.controller; if (!c) return res(null);
          var t = setTimeout(function () { res(null); }, 1500);
          navigator.serviceWorker.addEventListener('message', function on(e) { if (e.data && e.data.version) { clearTimeout(t); navigator.serviceWorker.removeEventListener('message', on); res(e.data.version); } });
          c.postMessage('version');
        });
      }
      function serverVersion() { // read straight from the server, never a cached copy
        if (!navigator.onLine) return Promise.resolve(null);
        return fetch('sw.js?check=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (t) { var m = /VERSION\s*=\s*`([^`]+)`/.exec(t); return m ? m[1] : null; }).catch(function () { return null; });
      }
      function installing() {
        if (!navigator.serviceWorker) return Promise.resolve(null);
        return navigator.serviceWorker.getRegistration('./').then(function (r) { return r && (r.installing || r.waiting) ? r : null; }).catch(function () { return null; });
      }
      function diagnose() {
        if (window.__paranStarted || shown) return; shown = true;
        show('Checking why Paran is slow to open…', [], '');
        Promise.all([phoneVersion(), serverVersion(), installing()]).then(function (r) {
          var mine = r[0], latest = r[1], reg = r[2];
          var vers = mine && latest ? (mine === latest ? 'Version ' + esc(num(mine)) + ', the latest' : 'This phone: version ' + esc(num(mine)) + ' · Latest: version ' + esc(num(latest)))
            : latest ? 'Latest version: ' + esc(num(latest)) : mine ? 'Version ' + esc(num(mine)) : '';
          if (reg) { // the new version is still downloading: say so, and open it as soon as it's ready
            show('Paran is updating to version ' + esc(num(latest)) + '. It opens by itself when the download finishes.', [['Open it now', 'location.reload()']], vers);
            var w = reg.installing || reg.waiting;
            var go = function () { if (w.state === 'installed' || w.state === 'activated') location.reload(); };
            if (w) { w.addEventListener('statechange', go); go(); }
            return;
          }
          if (!navigator.onLine && !(navigator.serviceWorker && navigator.serviceWorker.controller)) {
            return show('You’re offline, and Paran isn’t saved on this phone yet.', [AGAIN], 'Connect to Wi-Fi or mobile data, then try again.');
          }
          if (!navigator.onLine) {
            return show('You’re offline, and part of Paran on this phone didn’t load' + (problem && problem.file ? ' (' + esc(problem.file) + ')' : '') + '.', [AGAIN], 'Connect to the internet and it downloads again. ' + SAFE);
          }
          if (mine && latest && mine !== latest) {
            return show('This phone has an older version of Paran (version ' + esc(num(mine)) + '). Version ' + esc(num(latest)) + ' is ready.', [UPDATE, AGAIN], SAFE);
          }
          if (problem && problem.file) {
            return show('Part of Paran didn’t load on this phone (' + esc(problem.file) + ').', [UPDATE, AGAIN], vers + (vers ? '. ' : '') + 'Getting the latest version downloads all of it again. ' + SAFE);
          }
          if (problem && problem.msg) {
            return show('Paran hit an error while starting: “' + esc(problem.msg) + '”.', [UPDATE, AGAIN], vers + (vers ? '. ' : '') + 'Getting the latest version downloads the app again, which usually fixes this. ' + SAFE);
          }
          // nothing wrong found: the connection is just slow. Keep waiting; the app replaces this when it's ready.
          show('Paran is still opening. Your connection seems slow.', [AGAIN], (vers ? vers + '. ' : '') + 'It opens here by itself when it’s ready.');
          shown = false; setTimeout(diagnose, 10000);
        });
      }
      window.__paranRepair = function () {
        var jobs = [];
        // only this app's own worker and files: other apps on this site (the Stash pilot) are left alone
        var here = new URL('./', location.href).href;
        try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.filter(function (r) { return r.scope === here; }).map(function (r) { return r.unregister(); })); })); } catch (e) {}
        try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('paran-') === 0; }).map(function (k) { return caches.delete(k); })); })); } catch (e) {}
        Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now() + location.hash); });
      };
      setTimeout(diagnose, 8000);
      // what went wrong, for the message: a file that didn't load, or an error while starting
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) problem = { file: String(t.src || t.href).split('/').pop().split('?')[0] };
        else if (!problem) problem = { msg: String(e.message || 'unknown error').replace(/^Uncaught\s+/, '').slice(0, 120) };
        setTimeout(diagnose, 1200);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (!problem) problem = { msg: String((e.reason && e.reason.message) || e.reason || 'unknown error').slice(0, 120) };
        setTimeout(diagnose, 3000);
      });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
